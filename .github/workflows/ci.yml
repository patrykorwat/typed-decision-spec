name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lean-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the Lean project (needed by the export)
        run: lake build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run three-way conformance suite
        run: python3 conformance/conformance.py --all
